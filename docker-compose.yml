services:
  postgres:
    image: postgres:16-alpine
    container_name: anime_cards_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: anime_cards
      POSTGRES_USER: animebot
      POSTGRES_PASSWORD: change_me_strong_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animebot -d anime_cards"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: anime_cards_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: anime_cards_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.main"

volumes:
  postgres_data:
  redis_data:
